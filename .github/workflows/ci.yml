# CI for Decoy.
#
# CONFIRMED BUG, now fixed: this originally triggered on `branches: [main]`
# for both push and pull_request. This repo's actual default branch is
# `master` (confirmed via `gh repo view --json defaultBranchRef`), and
# every real commit lives on `feature/phase1` -- neither is named `main`,
# so this trigger never matched a single push in this repo's history.
# Confirmed directly: `gh api repos/<owner>/<repo>/actions/workflows`
# reported `total_count: 0` -- GitHub had never even registered this file
# as a workflow, because the only branch that has it (`feature/phase1`)
# never produced a push event this trigger would fire on. Fixed by
# triggering push on any branch (so work on a feature branch is verified
# the same way work on `master` would be, matching how this project is
# actually being developed) and pull_request against the real default
# branch, `master`, not the assumed-but-nonexistent `main`.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  python:
    name: Python (tests, benchmark suite, dependency scan)
    strategy:
      # CONFIRMED FINDING from this project's first real CI run: without
      # this, one matrix leg failing (ubuntu-latest's pip-audit finding)
      # cancelled the still-running macos-latest/windows-latest legs
      # ("The operation was canceled") BEFORE they could report their own
      # real pass/fail status -- macos-latest had, in fact, already passed
      # all 118 tests at the moment it was cancelled, which the Actions UI
      # then misleadingly presented as a same-shaped "X" failure
      # indistinguishable from a real per-OS bug. fail-fast: false ensures
      # every OS always reports its own genuine result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CONFIRMED FINDING, round 2: bumping pyproject.toml's build-system
      # `requires` floor alone did NOT fix pip-audit's setuptools finding
      # (re-ran and it still failed, same 79.0.1) -- that floor only
      # governs the ISOLATED build backend environment PEP 517 uses to
      # build the wheel, not the ambient/outer environment `pip-audit`
      # actually scans (this runner's own preinstalled setuptools, which
      # setup-python@v5 does not upgrade on its own).
      - name: Upgrade pip/setuptools (ambient env -- see comment above on why the pyproject.toml floor alone wasn't enough)
        run: pip install --upgrade pip "setuptools>=83.0.0"
      - name: Install package + dev/llm/mcp extras
        run: pip install -e ".[dev,llm,mcp]"
      - name: Run test suite
        run: python -m pytest tests/ -v
      - name: Run benchmark suite explicitly
        # Also covered by the full `pytest tests/` run above -- run again
        # standalone so a benchmark-suite-specific failure is unambiguous
        # in the Actions UI rather than buried in the full test log.
        run: python -m pytest tests/test_benchmark_suite.py -v
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit

  vscode-extension:
    name: VS Code extension (compile, lint, tests, dependency scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CONFIRMED FINDING from this project's first real CI run:
      # chatProxyManager.test.ts spawns a REAL `python -m decoy.cli
      # chat-proxy` subprocess (see that file's own module docstring --
      # deliberately not mocked) and needs the `decoy` package with its
      # chat-proxy extra (starlette/uvicorn/httpx) actually installed and
      # importable, exactly the same requirement this project's own
      # local-dev convention (`DECOY_TEST_PYTHON=.venv/bin/python`)
      # exists to satisfy. Without this, those 3 tests failed on CI with
      # ECONNREFUSED/"exited unexpectedly (code=1)" -- a real gap in the
      # CI config, not a code bug (locally this was always run against a
      # venv that already had these extras installed).
      - name: Install decoy package with chat-proxy extra (for chatProxyManager.test.ts's real subprocess tests)
        run: pip install -e ".[chat-proxy]"
      - run: npm install
        working-directory: vscode-extension
      - run: npm run compile
        working-directory: vscode-extension
      - run: npm run lint
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
        env:
          DECOY_TEST_PYTHON: python
      - run: npm audit
        working-directory: vscode-extension

  intellij-plugin-core:
    name: IntelliJ plugin core module (pure Kotlin, no SDK download)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intellij-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Run core module tests
        run: ./gradlew :core:test --console=plain
      # The `plugin` module (IntelliJ Platform SDK wiring) is deliberately
      # NOT built here -- it requires downloading a full IDE distribution,
      # and was never compiled in the environment that authored it either.
      # If/when that changes, add a separate job:
      #   - run: ./gradlew :plugin:buildPlugin --console=plain
      # and treat its first green run as real verification, not a rerun
      # of something already known to work.
