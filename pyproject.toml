[project]
name = "decoy"
version = "0.1.0"
description = "A privacy-masking layer for LLM pipelines: masks PII in prompts and database values before they reach any LLM, with a local audit trail and IDE controls."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "faker==30.8.2",
    "sqlalchemy==2.0.36",
    "pyyaml==6.0.2",
    "cryptography==50.0.0",
    # Cross-platform (Windows/POSIX) file locking for VaultManager's
    # on-disk persistence -- needed as soon as more than one process can
    # share a persisted vault (Phase "chat proxy"), which is core
    # behavior, not an optional extra. `fcntl` (POSIX-only) was
    # considered and rejected: it fails to import at all on Windows,
    # which is a real target platform for this project.
    "filelock==3.25.2",
]

[project.optional-dependencies]
ner = ["presidio-analyzer==2.2.357"]
mcp = ["mcp==2.1.1", "anyio==4.14.2"]
llm = ["anthropic==0.40.0"]
# HTTP framework for the chat-completions masking proxy (Anthropic
# /v1/messages + OpenAI /v1/chat/completions shapes) -- kept out of core
# deps since most Decoy usage (IDE extensions, MCP proxy, direct library
# use) never needs an HTTP server at all.
# starlette pinned to 1.6.0, not the 0.48.0 first tried here: pip-audit
# flagged several CVEs (PYSEC-2026-161/249/248/1942/2281/2280) against
# 0.48.0, all fixed only at 1.0.1+ -- caught before this ever shipped,
# not after.
chat-proxy = ["starlette==1.6.0", "uvicorn==0.38.0", "httpx==0.28.1"]
# pytest bumped 8.3.3 -> 9.1.1: pip-audit flagged PYSEC-2026-1845
# (CVE-2025-71176, a local tmp-dir naming race) against 8.3.3, fixed only
# starting 9.0.3. Full test suite re-run clean against 9.1.1 before
# pinning it.
dev = ["pytest==9.1.1", "pip-audit==2.7.3"]
# Separate from `dev`: pyinstaller is only needed to produce the
# standalone `decoy-proxy` binary (scripts/build_binary.py), not for
# day-to-day development/testing -- keeping it out of `dev` means a
# contributor running `pip install -e ".[dev]"` doesn't pull in a
# packaging tool they don't need.
build = ["pyinstaller==6.22.2"]

[project.scripts]
decoy = "decoy.cli:main"

[build-system]
# >=83 (not the previous >=68) -- CONFIRMED FINDING from this project's
# first real CI run: an unpinned floor let pip resolve 79.0.1, which
# `pip-audit` (running for real on GitHub's infra, not locally) flagged
# as PYSEC-2026-3447, fixed in 83.0.0. Bumping the floor here is the fix,
# not just noting it -- an unpinned build-backend dependency is exactly
# the kind of gap that stays invisible until a real, independent CI run
# actually checks it.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
